<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT Forms — Interactive Mockup</title>
<style>
/* ============================================================
   Real DayZ fonts (copied from P:\gui\fonts\)
   metronlight.ttf  = body text in COT (MetronLight14 etc)
   metronbook.ttf   = bolder accents (Metron-Bold58 = window title)
   ============================================================ */
@font-face {
  font-family: "MetronLight";
  src: url("cot-mockup-assets/fonts/metronlight.ttf") format("truetype");
  font-weight: normal; font-style: normal; font-display: block;
}
@font-face {
  font-family: "MetronBook";
  src: url("cot-mockup-assets/fonts/metronbook.ttf") format("truetype");
  font-weight: normal; font-style: normal; font-display: block;
}

/* ============================================================
   COTSurface palette (matches JM/COT/GUI/styles/cot.styles)
   In-game: dark navy panels with light grey strokes, slightly
   bigger text and chunkier controls than typical web UI.
   ============================================================ */
:root {
  /* --ui-scale: global multiplier applied via CSS zoom on .workspace
     to simulate DayZ engine resolution scaling. 1.0 = 1080p baseline. */
  --ui-scale: 1.0;
  --bg-deep:        #050709;
  --bg:             #07090d;
  --surface:        rgba(13,18,26,0.96);
  --surface-raised: rgba(20,27,38,0.96);
  --surface-soft:   rgba(255,255,255,0.04);
  --surface-deep:   rgba(5,8,14,0.85);
  --stroke:         rgba(180,200,225,0.20);
  --stroke-strong:  rgba(180,200,225,0.36);
  --stroke-focus:   rgba(79,156,255,0.70);
  --text:           #e8edf4;
  --text-dim:       #cdd5e0;
  --muted:          #9aa6b6;
  --accent:         #4f9cff;
  --accent-soft:    rgba(79,156,255,0.22);
  --good:           #49b875;
  --warn:           #d9a441;
  --danger:         #d85a5a;
  --info:           #7c93ff;
  --shadow:         rgba(0,0,0,0.55);
  font-family: "MetronLight", "Segoe UI", Arial, sans-serif;
}
/* Window titles use the heavier book cut (in-game: Metron-Bold58) */
.titlebar .title-text { font-family: "MetronBook", "MetronLight", "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body {
  background:
    linear-gradient(120deg, rgba(79,156,255,0.08), transparent 34%),
    linear-gradient(180deg, #0c1017, var(--bg));
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
}

/* ============================================================
   Picker bar (top) - replaces the old left nav panel
   ============================================================ */
.picker {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: rgba(5,8,14,0.96);
  border-bottom: 1px solid var(--stroke);
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px;
  z-index: 100;
}
.picker .pk-title { font-weight: 700; font-size: 14px; }
.picker select {
  background: rgba(0,0,0,0.32); border: 1px solid var(--stroke);
  color: var(--text); padding: 4px 10px; font-family: inherit; font-size: 13px;
  outline: none; min-width: 240px; cursor: pointer;
}
.picker select:focus { border-color: var(--stroke-focus); }
.picker .pk-hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.picker .pk-active-meta { color: var(--muted); font-size: 12px; }
.picker .pk-sep { width: 1px; height: 22px; background: var(--stroke); margin: 0 4px; }
.picker .pk-ctrl {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-dim); font-size: 12px; padding: 2px 6px;
  border: 1px solid transparent; border-radius: 3px;
  cursor: pointer; user-select: none;
}
.picker .pk-ctrl:hover { border-color: var(--stroke); background: rgba(255,255,255,0.03); }
.picker .pk-ctrl input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
.picker .pk-ctrl input[type="range"] { width: 96px; }
.picker .pk-num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 38px; }

/* ============================================================
   Engine-quirk simulation overlays
   ============================================================ */
/* Style trap: PanelWidget with `style COTSurface` but the style isn't
   registered for that widget type -> engine null-deref on first render. */
body.quirk-bad-style .style-trap {
  outline: 2px dashed #ff3b3b !important;
  outline-offset: -2px !important;
  background-image: repeating-linear-gradient(45deg, rgba(255,59,59,0.18), rgba(255,59,59,0.18) 6px, transparent 6px, transparent 12px) !important;
  position: relative;
}
body.quirk-bad-style .style-trap::after {
  content: "CTD"; position: absolute; top: 2px; right: 2px;
  background: #ff3b3b; color: #fff; font-size: 10px; font-weight: 700;
  padding: 1px 4px; border-radius: 2px; pointer-events: none;
  font-family: "Segoe UI", sans-serif;
}

/* Frame-with-style: FrameWidget silently ignores `style` -> visuals missing */
body.quirk-frame-style .frame-styled {
  outline: 2px dashed #d9a441 !important;
  outline-offset: -2px !important;
  background-image: repeating-linear-gradient(-45deg, rgba(217,164,65,0.16), rgba(217,164,65,0.16) 6px, transparent 6px, transparent 12px) !important;
  position: relative;
}
body.quirk-frame-style .frame-styled::after {
  content: "FRAME"; position: absolute; top: 2px; right: 2px;
  background: #d9a441; color: #1a1206; font-size: 10px; font-weight: 700;
  padding: 1px 4px; border-radius: 2px; pointer-events: none;
  font-family: "Segoe UI", sans-serif;
}

/* Overflow risk: label/text that *might* exceed its bounds in-game */
body.quirk-overflow .overflow-risk {
  position: relative;
}
body.quirk-overflow .overflow-risk::before {
  content: ""; position: absolute; inset: 0;
  outline: 1px dashed #4f9cff;
  pointer-events: none;
}
body.quirk-overflow .overflow-risk[data-overflow]::after {
  content: attr(data-overflow); position: absolute; top: -14px; left: 0;
  font-size: 9px; color: #4f9cff; white-space: nowrap;
  font-family: "Segoe UI", sans-serif;
  pointer-events: none;
}

/* Font fallback: simulate engine without our custom font loaded */
body.quirk-font-fallback,
body.quirk-font-fallback .window,
body.quirk-font-fallback .titlebar .title-text {
  font-family: "Times New Roman", serif !important;
  letter-spacing: 0.02em;
}

/* ============================================================
   Workspace
   ============================================================ */
.workspace {
  position: fixed; top: 44px; left: 0; right: 300px; bottom: 0;
  overflow: hidden;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='rgba(0,0,0,0)'/><path d='M0 0h100v100H0z' fill='none' stroke='rgba(255,255,255,0.02)' stroke-width='0.3'/></svg>");
}

/* ============================================================
   COT sidebar (right edge of the screen)
   Mirrors sidebar_menu.layout: 300px wide, dark header,
   category tiles, credits line.
   ============================================================ */
.sidebar {
  position: fixed; top: 44px; right: 0; bottom: 0;
  width: 300px;
  background: var(--surface);
  border-left: 1px solid var(--stroke);
  display: grid; grid-template-rows: 40px 1fr auto;
  z-index: 90;
}
.sidebar-header {
  padding: 0 14px;
  display: flex; align-items: center;
  background: rgba(5,8,14,0.96);
  border-bottom: 1px solid var(--stroke);
  font-weight: 700; font-size: 13px;
}
.sidebar-cats {
  padding: 8px;
  display: grid; gap: 8px;
  align-content: start;
  overflow: auto;
}
.sidebar-cat {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--surface-soft);
  border: 1px solid var(--stroke);
  cursor: pointer;
}
.sidebar-cat:hover { border-color: var(--stroke-focus); background: var(--accent-soft); }
.sidebar-cat.open { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.sidebar-cat .cat-icon {
  width: 22px; height: 22px;
  color: var(--accent);
  display: grid; place-items: center;
}
.sidebar-cat .cat-icon svg { width: 14px; height: 14px; fill: currentColor; }
.sidebar-cat .cat-name { flex: 1; font-size: 13px; }
.sidebar-cat .cat-count { font-size: 10px; color: var(--muted); }
.sidebar-credits {
  padding: 8px 14px;
  font-size: 10px;
  color: var(--muted);
  border-top: 1px solid var(--stroke);
}

/* Flyout (the per-category popup that floats to the LEFT of the sidebar) */
.flyout {
  position: fixed;
  width: 280px;
  background: rgba(13,18,26,0.98);
  border: 1px solid var(--stroke-strong);
  padding: 6px;
  display: grid; gap: 4px;
  box-shadow: 0 10px 32px var(--shadow);
  z-index: 95;
}
.flyout-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  background: var(--surface-soft);
  border: 1px solid transparent;
  cursor: pointer;
  height: 50px;
}
.flyout-item:hover {
  border-color: var(--stroke-focus);
  background: var(--accent-soft);
}
.flyout-item .fi-icon {
  width: 30px; height: 30px;
  background: var(--surface-deep);
  border: 1px solid var(--stroke);
  display: grid; place-items: center;
  color: var(--accent);
}
.flyout-item .fi-icon svg { width: 16px; height: 16px; fill: currentColor; }
.flyout-item .fi-name { flex: 1; font-size: 13px; }

/* ============================================================
   Window chrome — matches in-game windowbase.layout
   ============================================================ */
.window {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--stroke);
  box-shadow: 0 20px 56px var(--shadow);
  display: grid; grid-template-rows: 36px 1fr;
  user-select: none;
}
.window.dragging { box-shadow: 0 26px 64px rgba(0,0,0,0.7); border-color: var(--stroke-focus); }
.titlebar {
  height: 36px; display: flex; align-items: center;
  padding: 0 0 0 14px;
  background: rgba(5,8,14,0.96);
  border-bottom: 1px solid var(--stroke-strong);
  cursor: grab;
}
.titlebar.dragging { cursor: grabbing; }
.title-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
.title-meta { font-size: 11px; color: var(--muted); margin-right: 12px; }
.title-controls { display: flex; }
.title-controls button {
  width: 36px; height: 36px; border: 0;
  background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
  font-family: inherit;
}
.title-controls button:hover { background: var(--accent-soft); color: var(--text); }
.title-controls button.close:hover { background: rgba(216,90,90,0.3); color: var(--danger); }
.title-controls button svg { width: 14px; height: 14px; fill: currentColor; }

.window-body { padding: 0; overflow: hidden; position: relative; }

/* ============================================================
   Resize handles (8: edges + corners)
   Matches windowbase.layout: thin transparent draggable strips
   that highlight with a blue band on hover.
   ============================================================ */
.window .resize-handle {
  position: absolute;
  z-index: 5;
  background: transparent;
}
.window .resize-handle::after {
  content: ""; position: absolute; inset: 0;
  background: transparent;
}
.window .resize-handle.hover::after,
.window .resize-handle.dragging::after {
  background: var(--accent);
  opacity: 0.55;
}

/* Edge strips: 5px thick along the full edge */
.window .resize-handle.n { top: 36px; left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
.window .resize-handle.s { bottom: 0;  left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
.window .resize-handle.w { top: 46px;  bottom: 10px; left: 0;  width: 5px;  cursor: ew-resize; }
.window .resize-handle.e { top: 46px;  bottom: 10px; right: 0; width: 5px;  cursor: ew-resize; }
/* Corner pads: 10x10 */
.window .resize-handle.nw { top: 36px;    left: 0;  width: 10px; height: 10px; cursor: nwse-resize; }
.window .resize-handle.ne { top: 36px;    right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
.window .resize-handle.sw { bottom: 0;    left: 0;  width: 10px; height: 10px; cursor: nesw-resize; }
.window .resize-handle.se { bottom: 0;    right: 0; width: 10px; height: 10px; cursor: nwse-resize; }
/* While dragging anywhere, lock the cursor */
body.resizing { user-select: none; }
body.resizing.ns { cursor: ns-resize; }
body.resizing.ew { cursor: ew-resize; }
body.resizing.nwse { cursor: nwse-resize; }
body.resizing.nesw { cursor: nesw-resize; }

/* ============================================================
   Inspector overlay
   ============================================================ */
.inspector {
  position: absolute; top: 12px; right: 12px;
  width: 240px;
  background: rgba(5,8,14,0.95);
  border: 1px solid var(--stroke);
  padding: 10px 12px;
  font-size: 11px; line-height: 1.7;
  color: var(--text-dim);
  z-index: 50;
}
.inspector h4 { margin: 0 0 6px; font-size: 12px; color: var(--text); }
.inspector .ip-line { display: flex; justify-content: space-between; gap: 8px; }
.inspector .ip-line span:first-child { color: var(--muted); }

/* ============================================================
   COTSurface helper
   ============================================================ */
.cot-surface { background: var(--surface-raised); border: 1px solid var(--stroke); }
.cot-surface.deep { background: var(--surface-deep); }

/* ============================================================
   Buttons — in-game proportions
   ============================================================ */
.btn {
  height: 32px; padding: 0 14px;
  border: 1px solid var(--stroke); background: var(--surface-soft);
  color: var(--text); font-family: inherit; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
}
.btn:hover { border-color: var(--stroke-focus); background: var(--accent-soft); }
.btn.primary { border-color: var(--stroke-focus); background: var(--accent-soft); }
.btn.success { border-color: rgba(73,184,117,0.55); background: rgba(73,184,117,0.18); color: #c0e8d2; }
.btn.danger  { border-color: rgba(216,90,90,0.55); background: rgba(216,90,90,0.18); color: #f5c6c6; }
.btn.icon { width: 32px; padding: 0; }
.btn.fixed-32 { width: 32px; height: 32px; padding: 0; }
.btn.fixed-32 svg, .btn.icon svg { width: 16px; height: 16px; fill: currentColor; }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   ConfirmInline button (delete preset = trash, expands to OK/X)
   ============================================================ */
.cinline {
  display: inline-flex; height: 32px;
  border: 1px solid rgba(216,90,90,0.55);
  background: var(--surface-soft);
  cursor: pointer;
}
.cinline .ci-icon {
  width: 32px; display: grid; place-items: center;
  color: var(--danger); background: rgba(216,90,90,0.16);
}
.cinline .ci-icon svg { width: 14px; height: 14px; fill: currentColor; }
.cinline .ci-ok, .cinline .ci-cancel { display: none; }
.cinline.pending .ci-icon { display: none; }
.cinline.pending .ci-ok,
.cinline.pending .ci-cancel {
  display: grid; place-items: center;
  width: 36px; font-weight: 700; font-size: 12px;
}
.cinline.pending .ci-ok { background: rgba(73,184,117,0.25); color: var(--good); }
.cinline.pending .ci-cancel { background: rgba(216,90,90,0.25); color: var(--danger); border-left: 1px solid var(--stroke); }
.cinline.fixed-32 { width: 32px; height: 32px; }
.cinline.fixed-32:not(.pending) .ci-icon { width: 32px; height: 32px; }

/* ============================================================
   Search box - matches in-game "Search:" style
   The in-game one has icon left, full-width input, no clear by default
   ============================================================ */
.search {
  display: flex; align-items: center;
  height: 32px;
  background: rgba(0,0,0,0.36); border: 1px solid var(--stroke);
}
.search .s-icon { width: 36px; display: grid; place-items: center; color: var(--muted); }
.search .s-icon svg { width: 14px; height: 14px; fill: currentColor; }
.search input {
  flex: 1; background: transparent; border: 0; outline: none;
  color: var(--text); font-family: inherit; font-size: 13px; padding: 0 8px;
}
.search input::placeholder { color: var(--muted); font-style: italic; }
.search .s-clear {
  width: 32px; display: grid; place-items: center;
  color: var(--muted); border-left: 1px solid var(--stroke);
  cursor: pointer;
}
.search .s-clear:hover { color: var(--danger); }
.search .s-clear svg { width: 12px; height: 12px; fill: currentColor; }
.search.focus { border-color: var(--stroke-focus); }

/* ============================================================
   Field input with label - in-game uses a wider label area
   ============================================================ */
.field {
  display: flex; align-items: center;
  height: 32px;
  border: 1px solid var(--stroke); background: rgba(0,0,0,0.36);
}
.field .f-label {
  padding: 0 12px; font-weight: 700; font-size: 13px;
  border-right: 1px solid var(--stroke);
  display: grid; place-items: center; height: 100%;
  background: var(--surface-soft);
  min-width: 80px;
}
.field input {
  flex: 1; background: transparent; border: 0; outline: none;
  color: var(--text); font-family: inherit; font-size: 13px; padding: 0 10px;
}

/* ============================================================
   Dropdown
   ============================================================ */
.dd {
  display: flex; align-items: center; height: 32px;
  border: 1px solid var(--stroke); background: var(--surface-soft);
  cursor: pointer; position: relative;
}
.dd .dd-label {
  padding: 0 12px; font-weight: 700; font-size: 13px; color: var(--muted);
  border-right: 1px solid var(--stroke);
  display: grid; place-items: center; height: 100%;
}
.dd .dd-val { flex: 1; padding: 0 12px; font-size: 13px; }
.dd .dd-arrow {
  width: 32px; display: grid; place-items: center; color: var(--muted);
  border-left: 1px solid var(--stroke);
}
.dd .dd-arrow svg { width: 10px; height: 10px; fill: currentColor; }
.dd:hover, .dd.open { border-color: var(--stroke-focus); }

.dd-list {
  position: absolute; z-index: 200;
  background: rgba(13,18,26,0.98); border: 1px solid var(--stroke-strong);
  box-shadow: 0 12px 32px var(--shadow);
  display: none; min-width: 180px;
}
.dd-list.open { display: block; }
.dd-row {
  padding: 9px 14px; font-size: 13px; cursor: pointer;
  border-bottom: 1px solid rgba(155,184,218,0.08);
}
.dd-row:hover { background: var(--accent-soft); }
.dd-row.selected { background: var(--accent-soft); color: var(--accent); }

/* ============================================================
   Slider — in-game style: inline "Label: [track]  value"
   ============================================================ */
.slider {
  display: grid; grid-template-columns: 110px 1fr 56px;
  gap: 12px; align-items: center; height: 32px;
}
.slider .sl-label { font-weight: 700; font-size: 13px; }
.slider .sl-track {
  position: relative; height: 14px;
  background: rgba(7,10,16,0.7); border: 1px solid var(--stroke);
  cursor: pointer;
}
.slider .sl-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); }
.slider .sl-handle {
  position: absolute; top: -3px;
  width: 12px; height: 18px;
  background: #6db2ff; border: 1px solid var(--accent);
  transform: translateX(-50%);
}
.slider .sl-value {
  text-align: right; font-variant-numeric: tabular-nums; font-size: 13px;
  color: var(--text-dim); padding-right: 6px;
}

/* ============================================================
   Checkbox
   ============================================================ */
.cb {
  display: inline-flex; align-items: center; gap: 10px;
  height: 28px; cursor: pointer;
}
.cb .cb-box {
  width: 18px; height: 18px;
  border: 1px solid var(--stroke);
  background: rgba(120,120,130,0.18);
  display: grid; place-items: center;
}
.cb.checked .cb-box {
  background: var(--accent-soft); border-color: var(--stroke-focus);
}
.cb.checked .cb-box::after { content: ""; width: 10px; height: 10px; background: var(--accent); }
.cb .cb-label { font-size: 13px; }
.cb.round .cb-box, .cb.round .cb-box::after { border-radius: 50%; }

/* ============================================================
   Badge
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 9px; height: 22px;
  border: 1px solid var(--stroke); background: var(--surface-soft);
  font-size: 11px;
}
.badge .b-dot { width: 7px; height: 7px; background: var(--muted); }
.badge.good { border-color: rgba(73,184,117,0.55); }
.badge.good .b-dot { background: var(--good); }
.badge.warn { border-color: rgba(217,164,65,0.55); }
.badge.warn .b-dot { background: var(--warn); }
.badge.danger { border-color: rgba(216,90,90,0.55); }
.badge.danger .b-dot { background: var(--danger); }
.badge.info { border-color: rgba(124,147,255,0.55); }
.badge.info .b-dot { background: var(--info); }

/* ============================================================
   List — TextListboxWidget style (matches in-game)
   Light scrollbar, slim row separators, plain text rows
   ============================================================ */
.list {
  border: 1px solid var(--stroke); background: var(--surface-deep);
  overflow: auto;
  scrollbar-color: rgba(220,228,240,0.5) rgba(0,0,0,0.3);
}
.list::-webkit-scrollbar { width: 12px; background: rgba(0,0,0,0.3); }
.list::-webkit-scrollbar-thumb { background: rgba(220,228,240,0.4); border: 2px solid rgba(0,0,0,0.3); }
.list::-webkit-scrollbar-thumb:hover { background: rgba(220,228,240,0.6); }
.list-row {
  padding: 6px 12px; font-size: 13px; cursor: pointer;
  border-bottom: 1px solid rgba(155,184,218,0.06);
  display: flex; align-items: center; gap: 8px;
  min-height: 28px;
}
.list-row:hover { background: var(--accent-soft); }
.list-row.selected { background: var(--accent-soft); color: var(--accent); }

/* ============================================================
   Icon grid — vertical, 2-column, icon-only (UIActionIconGrid)
   This is what Object Spawner's categories actually look like.
   ============================================================ */
.icon-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; padding: 8px; overflow-y: auto;
  align-content: start;
}
.icon-grid .ig-cell {
  aspect-ratio: 1;
  background: var(--surface-soft); border: 1px solid var(--stroke);
  display: grid; place-items: center;
  cursor: pointer; position: relative;
  min-height: 42px;
}
.icon-grid .ig-cell:hover { border-color: var(--stroke-focus); background: var(--accent-soft); }
.icon-grid .ig-cell.selected {
  background: rgba(79,156,255,0.32); border-color: var(--accent);
}
.icon-grid .ig-cell svg { width: 28px; height: 28px; fill: var(--accent); }

/* Horizontal category strip (Object Spawner search-first layout) */
.cat-strip {
  display: flex; gap: 4px;
  overflow-x: auto; overflow-y: hidden;
  border: 1px solid var(--stroke);
  background: rgba(0,0,0,0.18);
  padding: 4px;
  scrollbar-width: thin;
}
.cat-strip::-webkit-scrollbar { height: 6px; }
.cat-strip::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 3px; }
.cat-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px;
  background: var(--surface-soft); border: 1px solid var(--stroke);
  cursor: pointer; user-select: none;
  white-space: nowrap; flex: 0 0 auto;
  height: 30px;
}
.cat-chip:hover { border-color: var(--stroke-focus); background: var(--accent-soft); }
.cat-chip.selected { background: rgba(79,156,255,0.32); border-color: var(--accent); }
.cat-chip svg { width: 16px; height: 16px; fill: var(--accent); }
.cat-chip-lbl { font-size: 11px; color: var(--text-dim); }
.cat-chip.selected .cat-chip-lbl { color: var(--text); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--stroke); }
.tabs .tab {
  padding: 8px 16px; font-size: 13px; cursor: pointer;
  color: var(--muted); border-right: 1px solid var(--stroke);
}
.tabs .tab:hover { color: var(--text); }
.tabs .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); margin-bottom: -1px; background: var(--accent-soft); }

/* Layout helpers */
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; }
.divider { height: 1px; background: var(--stroke); margin: 4px 0; }
.form-pane { padding: 12px; display: grid; gap: 10px; }
.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); padding-bottom: 4px;
  border-bottom: 1px solid var(--stroke);
}
.split { display: grid; gap: 8px; }
.split-2 { grid-template-columns: 1fr 1fr; }
</style>

/* ----------------- Picker setup ------------------------------- */
function buildPicker() {
  const sel = document.getElementById('formPicker');
  const groups = {};
  modules.forEach(m => (groups[m.cat] ??= []).push(m));
  sel.innerHTML = '';
  Object.entries(groups).forEach(([cat, mods]) => {
    const og = document.createElement('optgroup');
    og.label = cat;
    mods.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.title;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
  sel.addEventListener('change', () => openForm(sel.value));
}

/* ----------------- Sidebar setup ------------------------------ */
const sidebarCats = [
  { name:'Players',   icon:'sb_players' },
  { name:'World',     icon:'sb_world' },
  { name:'Items',     icon:'sb_items' },
  { name:'Vehicles',  icon:'sb_vehicles' },
  { name:'Events',    icon:'sb_events' },
  { name:'Server',    icon:'sb_server' },
  { name:'Expansion', icon:'sb_expansion' },
];

function buildSidebar() {
  const root = document.getElementById('sidebarCats');
  root.innerHTML = '';
  sidebarCats.forEach(c => {
    const count = modules.filter(m => m.cat === c.name).length;
    if (!count) return;
    const el = document.createElement('div');
    el.className = 'sidebar-cat';
    el.dataset.cat = c.name;
    el.innerHTML = `
      <span class="cat-icon">${icons[c.icon] || icons.sb_server}</span>
      <span class="cat-name">${c.name}</span>
      <span class="cat-count">${count}</span>
    `;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); toggleFlyout(c.name, el); });
    root.appendChild(el);
  });
}

let currentFlyout = null;
function toggleFlyout(catName, anchorEl) {
  // Close any existing flyout
  if (currentFlyout) {
    const wasSame = currentFlyout.cat === catName;
    closeFlyout();
    if (wasSame) return;
  }
  const fly = document.createElement('div');
  fly.className = 'flyout';
  const rect = anchorEl.getBoundingClientRect();
  fly.style.top = rect.top + 'px';
  fly.style.right = (window.innerWidth - rect.left + 6) + 'px';

  modules.filter(m => m.cat === catName).forEach(m => {
    const item = document.createElement('div');
    item.className = 'flyout-item';
    item.innerHTML = `
      <span class="fi-icon">${icons['m_' + m.id] || icons.sb_server}</span>
      <span class="fi-name">${m.title}</span>
    `;
    item.onclick = (e) => { e.stopPropagation(); openForm(m.id); closeFlyout(); };
    fly.appendChild(item);
  });
  document.body.appendChild(fly);
  anchorEl.classList.add('open');
  currentFlyout = { el: fly, cat: catName, anchor: anchorEl };

  // Defer the outside-click listener by a frame so this click doesn't immediately dismiss it
  setTimeout(() => document.addEventListener('click', onFlyoutOutside), 0);
}
function onFlyoutOutside(e) {
  if (!currentFlyout) return;
  if (currentFlyout.el.contains(e.target)) return;
  if (e.target.closest('.sidebar-cat')) return;
  closeFlyout();
}
function closeFlyout() {
  if (!currentFlyout) return;
  currentFlyout.el.remove();
  currentFlyout.anchor.classList.remove('open');
  currentFlyout = null;
  document.removeEventListener('click', onFlyoutOutside);
}

/* ----------------- Window builder ----------------------------- */
const openWindows = new Map();

function openForm(id) {
  const m = modules.find(x => x.id === id);
  if (!m) return;
  // close existing
  openWindows.forEach(w => w.remove());
  openWindows.clear();

  const ws = document.getElementById('workspace');
  const win = document.createElement('div');
  win.className = 'window style-trap';
  // Real layouts apply `style COTSurface` on the root PanelWidget; this is
  // the slot that engine-crashes if cot.styles is misconfigured. Flag it
  // when the "Show style traps" quirk is on.
  win.dataset.layoutWidget = 'PanelWidget';
  win.style.width = m.size[0] + 'px';
  win.style.height = m.size[1] + 'px';
  // Center the window in the workspace
  const wsRect = ws.getBoundingClientRect();
  const left = Math.max(20, (wsRect.width - m.size[0]) / 2);
  const top = Math.max(20, (wsRect.height - m.size[1]) / 2 - 30);
  win.style.left = left + 'px';
  win.style.top = top + 'px';
  win.style.zIndex = 100;
  win.innerHTML = `
    <div class="titlebar">
      <span class="title-text">${m.title}</span>
      <span class="title-meta" data-meta>${m.size[0]}×${m.size[1]}</span>
      <div class="title-controls">
        <button title="Pin">${icons.pin}</button>
        <button title="Minimize">${icons.expand}</button>
        <button class="close" title="Close">${icons.close}</button>
      </div>
    </div>
    <div class="window-body" data-body></div>

const MIN_WIDTH = 280;
const MIN_HEIGHT = 180;

function enableResize(win, m) {
  win.querySelectorAll('.resize-handle').forEach(handle => {
    const dir = handle.dataset.dir;
    handle.addEventListener('mouseenter', () => {
      if (!document.body.classList.contains('resizing')) handle.classList.add('hover');
    });
    handle.addEventListener('mouseleave', () => handle.classList.remove('hover'));

    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const sx = e.clientX, sy = e.clientY;
      const ox = parseFloat(win.style.left);
      const oy = parseFloat(win.style.top);
      const ow = win.offsetWidth;
      const oh = win.offsetHeight;
      handle.classList.add('dragging');
      document.body.classList.add('resizing');
      // Lock cursor while resizing
      if (dir === 'n' || dir === 's') document.body.classList.add('ns');
      else if (dir === 'w' || dir === 'e') document.body.classList.add('ew');
      else if (dir === 'nw' || dir === 'se') document.body.classList.add('nwse');
      else document.body.classList.add('nesw');

      function onMove(ev) {
        const dx = ev.clientX - sx;
        const dy = ev.clientY - sy;
        let nx = ox, ny = oy, nw = ow, nh = oh;

        if (dir.includes('e')) nw = Math.max(MIN_WIDTH, ow + dx);
        if (dir.includes('w')) {
          nw = Math.max(MIN_WIDTH, ow - dx);
          nx = ox + (ow - nw);
        }
        if (dir.includes('s')) nh = Math.max(MIN_HEIGHT, oh + dy);
        if (dir.includes('n')) {
          nh = Math.max(MIN_HEIGHT, oh - dy);
          ny = oy + (oh - nh);
        }

        win.style.left = nx + 'px';
        win.style.top = ny + 'px';
        win.style.width = nw + 'px';
        win.style.height = nh + 'px';

        // Reflect the live size on the title bar and inspector
        const meta = win.querySelector('[data-meta]');
        if (meta) meta.textContent = nw + '×' + nh;
        updateInspectorLive(m, win, nw, nh);
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('dragging', 'hover');
        document.body.classList.remove('resizing', 'ns', 'ew', 'nwse', 'nesw');
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function updateInspectorLive(m, win, w, h) {
  document.getElementById('ipForm').textContent = m.title;
  document.getElementById('ipSize').textContent = w + ' × ' + h;
  document.getElementById('ipPos').textContent =
    Math.round(parseFloat(win.style.left)) + ', ' + Math.round(parseFloat(win.style.top));
  document.getElementById('ipSrc').textContent = m.src;
  document.getElementById('pkMeta').textContent = w + '×' + h + ' — ' + m.src;
}

function enableDrag(win, m) {
  const bar = win.querySelector('.titlebar');
  let sx, sy, ox, oy, dragging = false;
  bar.addEventListener('mousedown', (e) => {
    if (e.target.closest('button')) return;
    dragging = true;
    bar.classList.add('dragging');
    win.classList.add('dragging');
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(win.style.left); oy = parseFloat(win.style.top);
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    win.style.left = (ox + e.clientX - sx) + 'px';
    win.style.top  = (oy + e.clientY - sy) + 'px';
    updateInspector(m, win);
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      bar.classList.remove('dragging');
      win.classList.remove('dragging');
    }
  });
}

function updateInspector(m, win) {
  document.getElementById('ipForm').textContent = m.title;
  document.getElementById('ipSize').textContent = m.size[0] + ' × ' + m.size[1];
  document.getElementById('ipPos').textContent =
    Math.round(parseFloat(win.style.left)) + ', ' + Math.round(parseFloat(win.style.top));
  document.getElementById('ipSrc').textContent = m.src;
  document.getElementById('pkMeta').textContent = m.size[0] + '×' + m.size[1] + ' — ' + m.src;
}
function resetInspector() {
  ['ipForm','ipSize','ipPos','ipSrc'].forEach(id => document.getElementById(id).textContent = '—');
  document.getElementById('pkMeta').textContent = '';
}

/* ============================================================
   Interactive widget binders
   ============================================================ */
function bindCheckbox(el) { el.addEventListener('click', () => el.classList.toggle('checked')); }
function bindConfirmInline(el) {
  el.addEventListener('click', (e) => {
    if (e.target.closest('.ci-ok')) {
      el.classList.remove('pending');
      flashRow(el, 'success');
    } else if (e.target.closest('.ci-cancel')) {
      el.classList.remove('pending');
    } else {
      el.classList.add('pending');
      setTimeout(() => el.classList.remove('pending'), 4000);
    }
  });
}
function flashRow(el, kind) {
  const orig = el.style.background;
  el.style.background = kind === 'success' ? 'rgba(73,184,117,0.32)' : 'rgba(216,90,90,0.32)';
  setTimeout(() => el.style.background = orig, 400);
}
function bindSlider(el) {
  const track = el.querySelector('.sl-track');
  const fill = el.querySelector('.sl-fill');
  const handle = el.querySelector('.sl-handle');
  const valEl = el.querySelector('.sl-value');
  const min = parseFloat(el.dataset.min || 0);
  const max = parseFloat(el.dataset.max || 100);
  const fmt = el.dataset.fmt || '';
  let dragging = false;
  function setFromX(clientX) {
    const r = track.getBoundingClientRect();
    let t = (clientX - r.left) / r.width;
    t = Math.max(0, Math.min(1, t));
    fill.style.width = (t * 100) + '%';
    handle.style.left = (t * 100) + '%';
    const v = min + t * (max - min);
    valEl.textContent = (Math.round(v * 10) / 10) + fmt;
  }
  track.addEventListener('mousedown', (e) => { dragging = true; setFromX(e.clientX); });
  document.addEventListener('mousemove', (e) => { if (dragging) setFromX(e.clientX); });
  document.addEventListener('mouseup', () => dragging = false);
}
function bindDropdown(el, options) {
  const val = el.querySelector('.dd-val');
  let list;
  el.addEventListener('click', () => {
    if (list) { list.remove(); list = null; el.classList.remove('open'); return; }
    list = document.createElement('div');
    list.className = 'dd-list open';
    const r = el.getBoundingClientRect();
    list.style.left = r.left + 'px';
    list.style.top = (r.bottom + 2) + 'px';
    list.style.width = r.width + 'px';
    options.forEach(opt => {
      const row = document.createElement('div');
      row.className = 'dd-row';
      if (opt === val.textContent) row.classList.add('selected');
      row.textContent = opt;
      row.onclick = (e) => { e.stopPropagation(); val.textContent = opt; list.remove(); list = null; el.classList.remove('open'); };
      list.appendChild(row);
    });
    document.body.appendChild(list);
    el.classList.add('open');
  });
}
function bindIconGrid(grid) {
  grid.querySelectorAll('.ig-cell').forEach(c => {
    c.addEventListener('click', () => {
      grid.querySelectorAll('.ig-cell').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    });
  });
}
function wireInteractive(root) {
  root.querySelectorAll('[data-cb]').forEach(bindCheckbox);
  root.querySelectorAll('[data-confirm]').forEach(bindConfirmInline);
  root.querySelectorAll('.slider').forEach(bindSlider);
  root.querySelectorAll('[data-dd]').forEach(el => {
    let opts;
    try { opts = JSON.parse(el.dataset.dd); } catch { opts = []; }
    bindDropdown(el, opts);
  });
  root.querySelectorAll('.icon-grid').forEach(bindIconGrid);
  root.querySelectorAll('.cat-strip').forEach(strip => {
    strip.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        strip.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });
  });
  root.querySelectorAll('.tabs').forEach(group => {
    group.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        group.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      };
    });
  });
}

/* ============================================================
   Engine-quirk + scaling controls
   ============================================================ */
/* DayZ scales the UI based on resolution. The engine uses a virtual
   "safezone" coordinate space and maps it to actual pixels; effectively
   the same layout renders larger at 4K and smaller at 720p. We simulate
   that by multiplying a base ratio (currentRes / 1080) with the user's
   UI Scale slider. */
function applyScale() {
  const res = document.getElementById('resPicker').value;
  const scaleSlider = parseFloat(document.getElementById('uiScale').value);
  document.getElementById('uiScaleVal').textContent = scaleSlider.toFixed(2) + 'x';
  const [w, h] = res.split('x').map(Number);
  // DayZ ties UI size to vertical resolution. 1080 = baseline.
  const resRatio = h / 1080;
  const effective = resRatio * scaleSlider;
  const ws = document.getElementById('workspace');
  // CSS `zoom` scales the whole workspace including hit-testing, which is
  // closest to what the engine does. Transform: scale() would break drag
  // math because the parent rect stays the unscaled size.
  ws.style.zoom = effective.toFixed(3);
  // Annotate picker so user knows what they're looking at.
  const meta = document.getElementById('pkMeta');
  if (meta) {
    const baseTxt = meta.dataset.base || meta.textContent;
    if (!meta.dataset.base) meta.dataset.base = baseTxt;
    meta.textContent = `${baseTxt} — ${res} @ ${effective.toFixed(2)}x effective`;
  }
}
document.getElementById('resPicker').addEventListener('change', applyScale);
document.getElementById('uiScale').addEventListener('input', applyScale);

function wireQuirk(id, cls) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => {
    document.body.classList.toggle(cls, el.checked);
  });
}
wireQuirk('quirkBadStyle',     'quirk-bad-style');
wireQuirk('quirkFrameStyle',   'quirk-frame-style');
wireQuirk('quirkOverflow',     'quirk-overflow');
wireQuirk('quirkFontFallback', 'quirk-font-fallback');

/* Auto-tag overflow-risk widgets after every render. We mark labels that
   are likely to clip in-game: text whose rendered width (in MetronLight)
   exceeds the parent column. The mockup uses the real Metron font now,
   so we can measure with canvas.measureText. */
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
function measureLabel(text, pxFont) {
  _measureCtx.font = pxFont + 'px MetronLight, "Segoe UI", sans-serif';
  return _measureCtx.measureText(text || '').width;
}
function tagOverflowRisks(scope) {
  scope = scope || document;
  // Heuristic: any element with class 'lbl', 'cb-label', 'btn-label', 'opt-label'
  // whose own text overruns its bounding box at the default font size.
  const sels = ['.lbl', '.cb-label', '.btn-label', '.opt-label', '.input-label', '.tile-label'];
  scope.querySelectorAll(sels.join(',')).forEach(el => {
    const txt = el.textContent.trim();
    if (!txt) return;
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize) || 13;
    const w  = measureLabel(txt, fs);
    const bw = el.clientWidth;
    if (bw > 0 && w > bw - 4) {
      el.classList.add('overflow-risk');
      el.setAttribute('data-overflow', `clips: ${Math.round(w)} > ${bw}px`);
    } else {
      el.classList.remove('overflow-risk');
      el.removeAttribute('data-overflow');
    }
  });
}
// Re-tag after every form open + after every resize.
const _origOpenForm = openForm;
window.openForm = function(id) {
  _origOpenForm(id);
  requestAnimationFrame(() => tagOverflowRisks());
};
window.addEventListener('resize', () => tagOverflowRisks());
// Also re-tag periodically because window-resize handlers in this mockup
// mutate widget bounds without firing the window 'resize' event.
setInterval(() => tagOverflowRisks(), 750);

   Init
